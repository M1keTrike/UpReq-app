org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Kotlin's incremental compiler computes relative paths between the Gradle
# build directory and dependency sources. On Windows, when the pub cache
# (C:\Users\...\Pub\Cache) and the project (D:\Dev\up-req) live on different
# drive letters, that relative-path calculation throws
# "this and base files have different roots" and the build fails outright.
# Disabling incremental compilation avoids the code path entirely; it only
# costs some rebuild speed, not correctness.
kotlin.incremental=false
