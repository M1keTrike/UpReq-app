name: up_req
description: "Levantamiento de requerimientos de software en campo. Aplicación personal, monousuario y sin servidor."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.12.2

# Versiones ancladas de forma exacta: la constitución fija estas versiones y CI las verifica.
# NINGUNA dependencia de red (FR-019). Sin sqlite3_flutter_libs: drift >= 2.32.0 empaqueta
# SQLite por su cuenta.
dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Estado. Versiones exactas fijadas por la constitución v1.2.0. NO subirlas sin verificar
  # que `flutter pub get` resuelve con drift presente: riverpod_generator >= 4.0.6 exige
  # analyzer 13 y resulta incompatible con drift_dev por la cadena test -> io.
  flutter_riverpod: 3.3.2
  riverpod_annotation: 4.0.3
  # La API experimental de Mutation<T> (research.md, decisión 1) vive en
  # package:riverpod/experimental/mutation.dart, no en el barrel de
  # flutter_riverpod: toda escritura de formulario/operación lógica la usa.
  riverpod: 3.3.2

  # Persistencia
  drift: 2.34.0

  # Navegación
  go_router: ^17.2.1

  # Utilidades de dominio
  uuid: ^4.5.1
  clock: ^1.1.2

  # Resuelve el directorio de datos de la app para el archivo de SQLite.
  # No es `drift_flutter`: ese paquete arrastra `sqlite3_flutter_libs`, que
  # T003 excluye a propósito porque drift ≥ 2.32.0 ya empaqueta SQLite.
  # `path_provider` en cambio solo resuelve una ruta de directorio: cero
  # dependencias de red, no reintroduce sqlite3_flutter_libs.
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  riverpod_lint: 3.1.4

  build_runner: ^2.15.1
  riverpod_generator: 4.0.4
  drift_dev: ^2.34.0

  # Solo para los scripts de tool/: parsear pubspec.lock
  yaml: ^3.1.3

  # Solo para test/drift/: SchemaVerifier usa package:test directamente, no
  # flutter_test (T020)
  test: ^1.31.0

flutter:
  uses-material-design: true
